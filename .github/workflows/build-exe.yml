name: Build Exe Archive

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build executable
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.15"
      UV_PYTHON_DOWNLOADS: "never"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python ${{ env.UV_PYTHON }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.UV_PYTHON }}

    - name: Install UV
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install the module
      run: |
        uv sync --group build

    - name: Build the application
      run: |
        uv run python application/setup.py build

    - name: Store the built application
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: splitguides-app
        path: build/SplitGuides_v*.zip

  add-to-github-release:
    name: >-
      Sign the zipapp with Sigstore
      and upload it to GitHub Release
    needs:
    - build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore
    steps:
    - name: Download the zipapp
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: splitguides-app
        path: dist/
    - name: Sign the zipapp with Sigstore
      uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
      with:
        release-signing-artifacts: false
        inputs: >-
          ./dist/*.zip
    - name: Upload artifact signature to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        "${GITHUB_REF_NAME}" dist/**
        --repo "${GITHUB_REPOSITORY}"
